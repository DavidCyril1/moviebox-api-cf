name = "moviebox-api-cf"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Required by socksflare so the Rustls WASM binary is bundled correctly
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallback = true
fallthrough = true

[vars]
# Optional:
# MB_TOKEN = ""
# MB_MIRROR_BASE = "https://moviebox.davidcyril.name.ng"
# MB_GUEST_TIMEOUT_MS = "90000"
# MB_REQUEST_TIMEOUT_MS = "30000"
